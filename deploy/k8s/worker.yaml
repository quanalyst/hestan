# NOT RUN AGAINST A CLUSTER. nothing in deploy/k8s has been applied to a
# cluster, scheduled by a kubelet or probed by one.
#
# the pods that execute: they claim runs off the queue and run them, and decide
# nothing. `HESTAN_ROLE=worker` is `Role::Worker`, which never takes the
# deciding lease however free it looks.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hestan-worker
  labels:
    app.kubernetes.io/name: hestan
    app.kubernetes.io/component: worker
spec:
  # any number. this is the one that is genuinely just a dial, because a
  # claimable queue is what makes workers interchangeable.
  #
  # two things scale with it and are not obvious. `HESTAN_SLOTS` is per pod, so
  # the deployment executes at most `replicas * slots` unless
  # `HESTAN_MAX_CONCURRENT_RUNS` is lower, which it should be. and a declared
  # rate is per **process**: three workers each honouring "five a second" send
  # fifteen, and the api on the other side sees fifteen. divide by this number
  # in the registry all of them build. see docs/scaling.md#a-rate-is-per-process
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: hestan
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hestan
        app.kubernetes.io/component: worker
      annotations:
        # inert on their own: something has to relabel on them, and that
        # something is also where the token goes, because an annotation cannot
        # carry one. `podmonitor.yaml` is the version that can
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hestan
          image: hestan-demo:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: HESTAN_ROLE
              value: worker
            # which installation this is: from the namespace, a name the
            # cluster already has and keeps in step with itself, so `prod` and
            # `staging` tell themselves apart with nothing to maintain. a
            # literal in the configmap is the alternative, and is what
            # `docker-compose.yml` does
            - name: HESTAN_DEPLOYMENT
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # **which build of the application this pod runs, and the two ways
            # it can get here.** UNVERIFIED like everything in this directory.
            #
            # hestan is a library compiled into your binary. it reads its own
            # version, its schema version and the features it compiled, and it
            # cannot read your git sha: something outside has to say it.
            #
            # 1. **baked into the image at build time**, which is what the
            #    `Dockerfile` at the repository root does with `--build-arg
            #    HESTAN_BUILD`, and what this file assumes: there is no
            #    `HESTAN_BUILD` in this env list because the image already
            #    carries it. the image and the answer cannot come apart, which
            #    is the reason to prefer it.
            # 2. **from the pod, through the downward api**, for an image that
            #    is not yours to rebuild. uncomment the three lines below and
            #    have kustomize or your release tool set the annotation on the
            #    pod template per release. this says what the *deployment*
            #    claims the build is, which is a weaker claim than the image's
            #    own.
            #
            # **do not do both.** an env var here overrides the image's, so an
            # unset annotation would replace a perfectly good baked-in sha with
            # an empty string, which hestan reads as "nobody said".
            #
            # - name: HESTAN_BUILD
            #   valueFrom:
            #     fieldRef:
            #       fieldPath: metadata.annotations['app.kubernetes.io/version']
          envFrom:
            - configMapRef:
                name: hestan
            - secretRef:
                name: hestan
          # a worker needs no socket at all, and gets one here because
          # `/api/health` is where it says which runs it is currently holding.
          # no service points at it; the port is for probes and for you
          ports:
            - name: http
              containerPort: 4000
          # the same probe as the scheduler's, proving the same thing and not
          # proving the same other thing; see scheduler.yaml
          livenessProbe:
            httpGet:
              path: /api/whoami
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/whoami
              port: http
            periodSeconds: 5
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /api/whoami
              port: http
            periodSeconds: 2
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: work
              mountPath: /var/lib/hestan
      volumes:
        - name: work
          emptyDir: {}
      # this is the pod the number matters for, because this one is holding
      # runs; see the long version in scheduler.yaml.
      #
      # SIGTERM stops it claiming anything new, gives what it is already
      # executing up to `Hestan::stop_within` to finish, and puts whatever did
      # not finish back on the queue for another worker. a released run is
      # **not** recorded as failed: it did not fail, this pod left.
      #
      # thirty is room for a deployment that raises `stop_within` to match how
      # long its ops take. with the default deadline the pod is gone in about
      # eight seconds whatever this says, because hestan's number is the one
      # that decides and this is only the ceiling on it. what a longer deadline
      # costs is that a rolling update is that much slower.
      terminationGracePeriodSeconds: 30
