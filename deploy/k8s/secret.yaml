# NOT RUN AGAINST A CLUSTER. nothing in deploy/k8s has been applied to a
# cluster, scheduled by a kubelet or probed by one.
#
# **this file is an example of the shape, not a secret.** a secret committed to
# a repository is not a secret, and `stringData` here is base64 away from being
# plaintext in etcd either way. take the two keys and put them wherever your
# cluster actually keeps credentials; what the pods need is these two names in
# their environment.
apiVersion: v1
kind: Secret
metadata:
  name: hestan
  labels:
    app.kubernetes.io/name: hestan
type: Opaque
stringData:
  # the run log, which is also the queue and the deciding lease. a database
  # every pod can reach: there is no postgres in this directory on purpose,
  # because a stateful database is not something a set of example manifests
  # should pretend to operate for you
  HESTAN_DB: "postgres://hestan:CHANGE_ME@postgres.default.svc.cluster.local:5432/hestan"
  # what the ui and the api ask for. see docs/auth.md, which also has the
  # version where your own proxy decides and hestan checks nothing
  HESTAN_TOKEN: "CHANGE_ME"
