name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hestan
          POSTGRES_PASSWORD: hestan
          POSTGRES_DB: hestan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features http -- -D warnings
      - run: cargo clippy --all-targets --features capture -- -D warnings
      - run: cargo clippy --all-targets --features postgres -- -D warnings
      - run: cargo clippy --all-targets --features otel -- -D warnings
      - run: cargo clippy --all-targets --features cli -- -D warnings
      - run: cargo clippy --all-targets --features parquet -- -D warnings
      - run: cargo clippy --all-targets --features dbt -- -D warnings
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      - run: cargo test --features http
      - run: cargo test --features capture
      - run: cargo test --features otel
      - run: cargo test --features cli
      - run: cargo test --features parquet
      - run: cargo test --features dbt
      # the store suite's postgres half runs against this and skips itself
      # without it; see docs/development.md
      - run: cargo test --features postgres
        env:
          HESTAN_TEST_PG: postgres://hestan:hestan@localhost:5432/hestan_test
      - run: cargo test --all-features
        env:
          HESTAN_TEST_PG: postgres://hestan:hestan@localhost:5432/hestan_test

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --all-features

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run lint
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run build
        working-directory: ui
      # the binary embeds ui/dist, so a stale committed bundle ships silently
      - run: git diff --exit-code ui/dist
