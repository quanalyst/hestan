[package]
name = "hestan"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "dag-based job orchestration with a small embedded web ui"
license = "MIT"
readme = "README.md"
keywords = ["orchestration", "scheduler", "dag", "pipeline", "cron"]
categories = ["asynchronous", "development-tools", "web-programming::http-server"]
repository = "https://github.com/quanalyst/hestan"
# an allowlist, the way `.dockerignore` is one, because the default is
# everything and the default put the ui's typescript sources, its npm lockfile,
# the container checks and the kubernetes manifests into the published crate.
# the rule: what compiling, testing and reading the library needs ships, and
# what builds or checks *the repository* stays in the repository, one clone
# away at the `repository` url above.
#
# `ui/dist` is here because `include_dir!` reads it at compile time and a crate
# without it does not build. `ui/src` and `ui/test` are the sources it was
# built from and nothing in a `cargo build` opens them. `docs/` is here because
# `src/` and `tests/docs.rs` read pages out of it with `include_str!` and
# `read_dir`, so a crate without it fails `cargo test`
include = [
    "/CHANGELOG.md",
    "/Cargo.lock",
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/SECURITY.md",
    "/docs",
    "/examples",
    "/src",
    "/tests",
    "/ui/dist",
]

# docs.rs builds with every feature on, so the postgres store, the cli, the
# capture layer, the otel bridge and the http source are all on the page,
# and `--cfg docsrs` is what makes each of them carry the feature it needs.
# nothing else sets that cfg, so an ordinary `cargo doc` is unaffected
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# the `parquet` feature only: json rows become arrow arrays on the way into a
# file and json rows again on the way out. `json` is the only part of arrow
# hestan uses: no csv reader, no ipc, no compute kernels
arrow = { version = "57.3", optional = true, default-features = false, features = ["json"] }
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
# the `cli` feature only: argv, the help text and the usage errors. optional
# because a library has no business owning a process's arguments until it is
# handed them
clap = { version = "4", optional = true, features = ["derive"] }
cron = "0.17"
futures = "0.3"
include_dir = "0.7"
mime_guess = "2"
# the `otel` feature only: the opentelemetry context types, the w3c propagator
# that carries one across a process boundary, and the tracing bridge that reads
# a span's context out of the host's subscriber. no exporter, no provider
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", optional = true, default-features = false, features = ["trace"] }
# the `parquet` feature only, and pinned to the same major as arrow because the
# two are one project released together. snappy is the only codec compiled in:
# it is what a parquet reader everywhere already handles, and the other four
# would each be a c library or a megabyte of tables for files hestan writes and
# reads back itself
parquet = { version = "57.3", optional = true, default-features = false, features = ["arrow", "snap"] }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls"] }
rusqlite = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "process", "signal", "io-util"] }
tokio-postgres = { version = "0.7", optional = true }
tracing = "0.1"
tracing-opentelemetry = { version = "0.33", optional = true, default-features = false }
# the `capture` feature only: the Layer trait the host composes hestan's
# capture layer into its own subscriber with
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["registry", "std"] }
uuid = { version = "1", features = ["v7"] }

# isolated ops only: kill(2), the signal names a dead child is reported with,
# and setrlimit(2) for the memory and cpu limits
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# the rate suite drives a paused clock, so what a waiter did is asserted by the
# instant it did it at rather than by how long the test took on a busy machine
tokio = { version = "1", features = ["test-util"] }
# the worked example in `Hestan::resource` connects to a real postgres, and it
# is a doctest rather than a snippet, so the client it calls has to be here
# whether or not the `postgres` feature is on. hestan does not wrap it: that is
# the point the example is making
tokio-postgres = "0.7"
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# the isolation test watches a child process die, which is a kill(pid, 0) away
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[features]
default = ["bundled"]
# compiles sqlite from source; disable to link the system library instead,
# which then has to be installed where the linker can find it
bundled = ["rusqlite/bundled"]
http = ["dep:reqwest"]
# a command line in your own binary: `hestan::cli::run`, and the standalone
# `hestan` binary beside it. off by default because a deployment that only
# serves should not compile a parser it never calls
cli = ["dep:clap", "dep:reqwest"]
# `hestan::capture_layer`, for a host that wants the tracing events its ops
# emit on the run page. off by default: it is the host's subscriber, and
# hestan does not install one
capture = ["dep:tracing-subscriber"]
# a shared run log on a postgres server, for the deployments sqlite's one-host
# file cannot serve. sqlite stays the default and needs no server
postgres = ["dep:tokio-postgres"]
# a run as a distributed trace: `hestan::otel`, and the w3c context an isolated
# op's subprocess is handed so its spans nest under the op that spawned it. off
# by default, and it installs nothing: the host composes the layer and owns
# the exporter, exactly as it does for `capture`
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:tracing-opentelemetry"]
# `hestan::ParquetIo`, an io manager that stores op outputs as parquet files
# rather than as json. off by default because arrow and parquet are a large
# dependency to hand a deployment whose outputs are `{"loaded": 4210}`
parquet = ["dep:arrow", "dep:parquet"]
# `hestan::dbt`: a dbt project's models as assets, read out of the manifest dbt
# compiled. no dependency of its own (a manifest is json), and off by default
# because most deployments have no dbt project to read
dbt = []

# the operator's binary: the store and server modes with no registry of its
# own, for inspecting a database or driving a running instance. behind the
# same feature, so a default build compiles no binary at all
[[bin]]
name = "hestan"
required-features = ["cli"]

[[example]]
name = "assets"
required-features = ["cli"]

[[example]]
name = "demo"
required-features = ["cli"]

[[example]]
name = "http_source"
required-features = ["http"]

[[test]]
name = "http_source"
required-features = ["http"]

[[test]]
name = "notify"
required-features = ["http"]

# the capture layer needs a subscriber, and a subscriber in a test binary is a
# thread-local thing every other test in that binary can invalidate; see the
# comment at the top of the file
[[test]]
name = "capture"
required-features = ["capture"]

# and the span shape a run has on the trace bus, for the same reason
[[test]]
name = "otel"
required-features = ["otel"]

# the parquet manager between two ops of a run, which needs the manager
[[test]]
name = "parquet"
required-features = ["parquet"]

# a dbt project's models built as assets, with something standing in for dbt
[[test]]
name = "dbt"
required-features = ["dbt"]

# an isolated op re-executes `current_exe()`, so this target needs a `main` of
# its own that rebuilds the same jobs; see the comment at the top of the file
[[test]]
name = "isolation"
harness = false

# and the queue's workers are this same binary started with a role, for the same
# reason: one image, one registry, several processes
[[test]]
name = "queue"
harness = false

# every case in the cli suite is this same binary started with argv and watched
# for what it exits with, which is not something a function call has, so it
# needs a `main` of its own that can be the command line
[[test]]
name = "cli"
harness = false
required-features = ["cli"]

# a token and every place it must not be: this binary is both the deployment
# under test and the thing driving it, so it needs a `main` of its own
[[test]]
name = "auth"
harness = false

# a served process signalled from outside and watched for how it exits, which
# is a fact about a process rather than about a function call, so this one
# needs a `main` that can be the deployment being stopped
[[test]]
name = "stopping"
harness = false
