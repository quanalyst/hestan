[package]
name = "hestan"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.88"
description = "dag-based job orchestration with a small embedded web ui"
license = "MIT"
readme = "README.md"
keywords = ["orchestration", "scheduler", "dag", "pipeline", "cron"]
categories = ["asynchronous", "development-tools", "web-programming::http-server"]
repository = "https://github.com/quanalyst/hestan"

[package.metadata.docs.rs]
all-features = true

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.17"
futures = "0.3"
include_dir = "0.7"
mime_guess = "2"
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls"] }
rusqlite = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "process", "signal"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }

# isolated ops only: kill(2), the signal names a dead child is reported with,
# and setrlimit(2) for the memory and cpu limits
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# the isolation test watches a child process die, which is a kill(pid, 0) away
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[features]
default = ["bundled"]
# compiles sqlite from source; disable to link the system library
bundled = ["rusqlite/bundled"]
http = ["dep:reqwest"]

[[example]]
name = "http_source"
required-features = ["http"]

[[test]]
name = "http_source"
required-features = ["http"]

[[test]]
name = "notify"
required-features = ["http"]

# an isolated op re-executes `current_exe()`, so this target needs a `main` of
# its own that rebuilds the same jobs — see the comment at the top of the file
[[test]]
name = "isolation"
harness = false

# and the queue's workers are this same binary started with a role, for the same
# reason: one image, one registry, several processes
[[test]]
name = "queue"
harness = false
